<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560" font-family="'WenQuanYi Zen Hei', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="460" height="560" fill="#ffffff"/>
<text x="230.0" y="20" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">写路径（Put / Delete）</text>
<rect x="70" y="32" width="320" height="44" rx="5" fill="#eef2f7" stroke="#44546a" stroke-width="1.3"/>
<text x="230.0" y="51.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">Put / Delete</text>
<text x="230.0" y="67.0" font-size="11.5" fill="#333" text-anchor="middle">任意线程；write_mu_ 串行化 = 单写者</text>
<rect x="70" y="96" width="320" height="44" rx="5" fill="#eef2f7" stroke="#44546a" stroke-width="1.3"/>
<text x="230.0" y="115.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">MakeRoomForWrite</text>
<text x="230.0" y="131.0" font-size="11.5" fill="#333" text-anchor="middle">imm_ 未刷完 或 L0 ≥ 12：等待（写停顿）</text>
<rect x="70" y="160" width="320" height="44" rx="5" fill="#fdf0d5" stroke="#9a6a00" stroke-width="1.3"/>
<text x="230.0" y="179.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">① WAL 追加  NNNNNN.log</text>
<text x="230.0" y="195.0" font-size="11.5" fill="#333" text-anchor="middle">[crc32][len][type|klen|key|vlen|value]</text>
<rect x="70" y="224" width="320" height="44" rx="5" fill="#e3f0e3" stroke="#3c763d" stroke-width="1.3"/>
<text x="230.0" y="243.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">② MemTable mem_（跳表）</text>
<text x="230.0" y="259.0" font-size="11.5" fill="#333" text-anchor="middle">独占锁插入；同键覆盖，删除写墓碑</text>
<line x1="230.0" y1="76" x2="230.0" y2="96" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="230.0" y1="140" x2="230.0" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="230.0" y1="204" x2="230.0" y2="224" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="238.0" y="218" font-size="11" fill="#9a6a00" text-anchor="start">sync_wal=true 时 fdatasync</text>
<line x1="230.0" y1="268" x2="230.0" y2="296" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="238.0" y="286.0" font-size="11.5" fill="#333" text-anchor="start">≥ 4MB：冻结 + 换新 WAL</text>
<rect x="70" y="296" width="320" height="44" rx="5" fill="#e3f0e3" stroke="#3c763d" stroke-width="1.3"/>
<text x="230.0" y="315.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">Immutable MemTable imm_</text>
<text x="230.0" y="331.0" font-size="11.5" fill="#333" text-anchor="middle">只读，等待后台刷盘</text>
<rect x="8" y="362" width="444" height="192" rx="5" fill="#e8e4f3" stroke="#5b4a9c" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="230.0" y="463.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold"></text>
<text x="128" y="379" font-size="11.5" fill="#5b4a9c" text-anchor="start" font-weight="bold">后台线程（唯一）：放开 mu_ 做 I/O</text>
<line x1="116" y1="340" x2="116" y2="386" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="18" y="386" width="196" height="44" rx="5" fill="#fdf0d5" stroke="#9a6a00" stroke-width="1.3"/>
<text x="116.0" y="405.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">③ 写 L0 SSTable 并 fsync</text>
<text x="116.0" y="421.0" font-size="11.5" fill="#333" text-anchor="middle">数据块 | 布隆 | 索引 | footer</text>
<rect x="246" y="386" width="196" height="44" rx="5" fill="#fdf0d5" stroke="#9a6a00" stroke-width="1.3"/>
<text x="344.0" y="405.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">④ 原子重写 MANIFEST</text>
<text x="344.0" y="421.0" font-size="11.5" fill="#333" text-anchor="middle">tmp→fsync→rename→fsync 目录</text>
<line x1="214" y1="408" x2="246" y2="408" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="246" y="442" width="196" height="44" rx="5" fill="#e8e4f3" stroke="#5b4a9c" stroke-width="1.3"/>
<text x="344.0" y="461.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">⑤ 装新 Version，删旧 WAL</text>
<text x="344.0" y="477.0" font-size="11.5" fill="#333" text-anchor="middle">编号 &lt; MinLiveLogNumber()</text>
<line x1="344" y1="430" x2="344" y2="442" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="18" y="500" width="424" height="44" rx="5" fill="#fdf0d5" stroke="#9a6a00" stroke-width="1.3"/>
<text x="230.0" y="519.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">Leveled Compaction  L0→L1→L2→L3</text>
<text x="230.0" y="535.0" font-size="11.5" fill="#333" text-anchor="middle">分数 ≥ 1 触发；trivial move；墓碑回收</text>
<line x1="344" y1="486" x2="344" y2="500" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
