<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560" font-family="'WenQuanYi Zen Hei', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="460" height="560" fill="#ffffff"/>
<text x="230.0" y="20" font-size="15" fill="#111" text-anchor="middle" font-weight="bold">读路径（Get）</text>
<rect x="10" y="32" width="238" height="44" rx="5" fill="#eef2f7" stroke="#44546a" stroke-width="1.3"/>
<text x="129.0" y="51.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">Get(key)</text>
<text x="129.0" y="67.0" font-size="11.5" fill="#333" text-anchor="middle">任意线程，可并发</text>
<rect x="10" y="108" width="238" height="44" rx="5" fill="#eef2f7" stroke="#44546a" stroke-width="1.3"/>
<text x="129.0" y="127.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">拷贝 SuperVersion</text>
<text x="129.0" y="143.0" font-size="11.5" fill="#333" text-anchor="middle">mu_ 内只拷 3 个 shared_ptr，随即放锁</text>
<rect x="10" y="184" width="238" height="44" rx="5" fill="#e3f0e3" stroke="#3c763d" stroke-width="1.3"/>
<text x="129.0" y="203.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">MemTable mem_</text>
<text x="129.0" y="219.0" font-size="11.5" fill="#333" text-anchor="middle">共享锁；跳表查找</text>
<rect x="10" y="260" width="238" height="44" rx="5" fill="#e3f0e3" stroke="#3c763d" stroke-width="1.3"/>
<text x="129.0" y="279.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">Immutable MemTable imm_</text>
<text x="129.0" y="295.0" font-size="11.5" fill="#333" text-anchor="middle">可能为空</text>
<rect x="10" y="336" width="238" height="44" rx="5" fill="#fdf0d5" stroke="#9a6a00" stroke-width="1.3"/>
<text x="129.0" y="355.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">L0：按 新→旧 逐个文件</text>
<text x="129.0" y="371.0" font-size="11.5" fill="#333" text-anchor="middle">文件间键范围可重叠</text>
<rect x="10" y="412" width="238" height="44" rx="5" fill="#fdf0d5" stroke="#9a6a00" stroke-width="1.3"/>
<text x="129.0" y="431.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">L1 → L2 → L3</text>
<text x="129.0" y="447.0" font-size="11.5" fill="#333" text-anchor="middle">每层二分定位至多 1 个文件</text>
<line x1="129.0" y1="76" x2="129.0" y2="108" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="129.0" y1="152" x2="129.0" y2="184" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="129.0" y1="228" x2="129.0" y2="260" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="137.0" y="248.0" font-size="11.5" fill="#333" text-anchor="start">kNotFound：继续</text>
<line x1="129.0" y1="304" x2="129.0" y2="336" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="137.0" y="324.0" font-size="11.5" fill="#333" text-anchor="start">kNotFound：继续</text>
<line x1="129.0" y1="380" x2="129.0" y2="412" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="137.0" y="400.0" font-size="11.5" fill="#333" text-anchor="start">kNotFound：继续</text>
<line x1="129.0" y1="456" x2="129.0" y2="496" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="10" y="496" width="298" height="48" rx="5" fill="#eef2f7" stroke="#44546a" stroke-width="1.3"/>
<text x="159.0" y="517.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold">首个 kFound / kDeleted 即返回</text>
<text x="159.0" y="533.0" font-size="11.5" fill="#333" text-anchor="middle">全部 kNotFound → 键不存在</text>
<rect x="262" y="300" width="192" height="172" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="358.0" y="391.0" font-size="13.5" fill="#111" text-anchor="middle" font-weight="bold"></text>
<text x="358.0" y="318" font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold">单个 SSTable 内（Table::Get）</text>
<text x="270" y="342" font-size="11.2" fill="#222" text-anchor="start">1  键在 [smallest, largest] 内？</text>
<text x="270" y="370" font-size="11.2" fill="#222" text-anchor="start">2  布隆过滤器（常驻内存）</text>
<text x="270" y="398" font-size="11.2" fill="#222" text-anchor="start">3  索引二分 → 定位 1 个数据块</text>
<text x="270" y="426" font-size="11.2" fill="#222" text-anchor="start">4  1 次 pread + CRC 校验</text>
<text x="270" y="454" font-size="11.2" fill="#222" text-anchor="start">5  整块解析后二分</text>
<line x1="248" y1="358" x2="262" y2="358" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="248" y1="434" x2="262" y2="434" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3"/>
</svg>
